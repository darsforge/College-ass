$kind: http-request
url: "{{baseUrl}}/api/students/{{studentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Correct student', () => pm.expect(pm.response.json()._id).to.eql(pm.collectionVariables.get('studentId')));
    language: text/javascript
order: 3000
