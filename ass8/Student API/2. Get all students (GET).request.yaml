$kind: http-request
url: "{{baseUrl}}/api/students"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Has students array', () => pm.expect(pm.response.json().students).to.be.an('array'));
    language: text/javascript
order: 2000
