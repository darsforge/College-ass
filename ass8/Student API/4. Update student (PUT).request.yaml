$kind: http-request
url: "{{baseUrl}}/api/students/{{studentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Darshan Patil",
      "rollNo": "IT101",
      "email": "darshan@example.com",
      "branch": "IT",
      "year": 4,
      "phone": "9123456780"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Year updated to 4', () => pm.expect(pm.response.json().year).to.eql(4));
    language: text/javascript
order: 4000
