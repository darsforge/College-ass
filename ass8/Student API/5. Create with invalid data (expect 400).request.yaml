$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "A1",
      "rollNo": "IT102",
      "email": "bad",
      "branch": "IT",
      "year": 9,
      "phone": "123"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
